<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wedding Invitation</title>
  <style>
    body {
      background-color: #f9f6f0;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
    }
    .invitation-container {
      max-width: 500px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      border-radius: 12px;
      overflow: hidden;
      background: #fff;
      display: flex;
      flex-direction: column;
    }
    .invitation-container img {
      width: 100%;
      height: auto;
      display: block;
    }
    .music-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 50px;
      height: 50px;
      background: #8c6d53;
      color: #fff;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      font-size: 22px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body onclick="playMusicOnTouch()">

  <!-- ملف الصوت المرفوع -->
  <audio id="weddingSong" loop preload="auto">
    <source src="music.mp3.mp3" type="audio/mpeg">
  </audio>

  <!-- زرار التحكم بالصوت عائم -->
  <button class="music-btn" onclick="event.stopPropagation(); toggleMusic();">🎵</button>

  <div class="invitation-container">
    <!-- صورة تصميم كانفا الخاصة بكِ -->
    <img src="card.png.png" alt="Wedding Invitation">
  </div>

  <script>
    const song = document.getElementById("weddingSong");
    let hasPlayed = false;

    // تشغيل الأغنية تلقائياً فور أول لمسة للشاشة
    function playMusicOnTouch() {
      if (!hasPlayed) {
        song.play().then(() => {
          hasPlayed = true;
        }).catch(err => {
          console.log("Autoplay blocked waiting for user interaction");
        });
      }
    }

    // زرار للتحكم (إيقاف/تشغيل)
    function toggleMusic() {
      if (song.paused) {
        song.play();
      } else {
        song.pause();
      }
    }
  </script>
</body>
</html>
