<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wedding Invitation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cairo:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f9f6f0;
      --card-bg: #fdfbf7;
      --card-inner: #f4eee2;
      --primary: #4a3b32;
      --accent: #8c6d53;
      --accent-light: #d8c8b8;
      --envelope-base: #dfd3c3;
      --envelope-flap: #cfbfad;
      --heart: #6e473b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--primary);
      font-family: 'Cairo', sans-serif;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 15px;
    }
    .container {
      max-width: 480px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
    }
    .header-title {
      font-family: 'Alex Brush', cursive;
      font-size: 42px;
      color: var(--accent);
      text-align: center;
      margin-top: 10px;
    }
    .music-btn {
      position: fixed;
      bottom: 25px;
      left: 25px;
      width: 48px;
      height: 48px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      font-size: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .envelope-box {
      width: 280px;
      height: 200px;
      position: relative;
      cursor: pointer;
      margin: 40px auto 20px;
    }
    .envelope {
      width: 100%;
      height: 100%;
      background: var(--envelope-base);
      border-radius: 6px;
